name: Apollo Atomics Inc
description: >-
  Apollo Atomics is a Y Combinator-backed (Spring 2026 / P26) nuclear technology
  company building compact, power-dense pressurized water reactors for electricity
  generation, industrial process heat, and data-center power. Founded by Assil Halimi
  and Drew Walker and based in Cambridge, Massachusetts, the company modifies the
  steam generator of proven pressurized water reactor technology to shrink the plant
  by roughly an order of magnitude without sacrificing power output, turning a
  decade-long construction project into a factory-built machine that can ship on a
  truck. Apollo has announced a research collaboration with MIT's Department of
  Nuclear Science and Engineering to validate its reactor design and has submitted a
  regulatory engagement plan to the U.S. Nuclear Regulatory Commission, targeting a
  construction permit application in 2028. This is a hardware/energy company with no
  public developer or API surface at this time.
